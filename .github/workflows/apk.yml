name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sabit imza anahtarı GitHub Secrets'tan gelir (repoda yok). Yoksa debug imzası
      # kullanılır ama sürüm YAYINLANMAZ; aksi halde uygulama içi güncelleme bozulur.
      - name: İmza anahtarını hazırla
        id: sign
        env:
          EVTV_KEYSTORE_B64: ${{ secrets.EVTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$EVTV_KEYSTORE_B64" ]; then
            echo "$EVTV_KEYSTORE_B64" | base64 -d > app/evtv-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::EVTV_KEYSTORE_B64 gizli ayarı yok; APK debug imzalı, sürüm yayınlanmayacak."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        env:
          EVTV_KEY_PASS: ${{ secrets.EVTV_KEY_PASS }}
        run: gradle --no-daemon assembleRelease

      - name: Dosya adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk ev-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ev-tv-apk
          path: ev-tv.apk
          retention-days: 30

      # main'e her push'ta: app/build.gradle'daki versionName ile (ör. v1.0) Release açılır/güncellenir
      - name: Sürüm numarasını oku
        if: github.ref == 'refs/heads/main'
        id: ver
        run: echo "name=v$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Sürüm yayınla
        if: steps.sign.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name || github.ref_name }}
          name: Ev TV ${{ steps.ver.outputs.name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ev-tv.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
