name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        run: gradle --no-daemon assembleRelease

      - name: Dosya adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk ev-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ev-tv-apk
          path: ev-tv.apk
          retention-days: 30

      # v1.0 gibi bir etiket gönderilince APK Releases sayfasına yüklenir
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ev-tv.apk
          generate_release_notes: true
