name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # İmza: Android debug anahtarı (v1.2'de sorunsuz kurulan tür). Anahtar dosyası
      # Actions önbelleğinde saklanır; her sürüm aynı anahtarla imzalanır ki
      # eskinin üzerine güncelleme olarak kurulsun. keepalive.yml önbelleği canlı tutar.
      - name: İmza anahtarı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: evtv-debug-keystore-v1

      - name: APK derle
        run: gradle --no-daemon assembleRelease

      - name: Dosya adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk ev-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ev-tv-apk
          path: ev-tv.apk
          retention-days: 30

      # main'e her push'ta: app/build.gradle'daki versionName ile (ör. v1.0) Release açılır/güncellenir
      - name: Sürüm numarasını oku
        if: github.ref == 'refs/heads/main'
        id: ver
        run: echo "name=v$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Sürüm yayınla
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name || github.ref_name }}
          name: Ev TV ${{ steps.ver.outputs.name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ev-tv.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
