name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sabit imza anahtarı: her sürüm aynı anahtarla imzalanmalı ki uygulama içinden
      # güncelleme kurulabilsin. Anahtar repoda YOK. Öncelik GitHub Secrets'ta
      # (EVTV_KEYSTORE_B64 + EVTV_KEY_PASS); yoksa ilk derlemede rastgele şifreyle
      # üretilip Actions önbelleğinde saklanır (keepalive.yml önbelleği canlı tutar).
      - name: İmza anahtarı önbelleği
        uses: actions/cache@v4
        with:
          path: .evtv-signing
          key: evtv-signing-v1

      - name: İmza anahtarını hazırla
        id: sign
        env:
          EVTV_KEYSTORE_B64: ${{ secrets.EVTV_KEYSTORE_B64 }}
          SECRET_PASS: ${{ secrets.EVTV_KEY_PASS }}
        run: |
          if [ -n "$EVTV_KEYSTORE_B64" ] && [ -n "$SECRET_PASS" ]; then
            echo "$EVTV_KEYSTORE_B64" | base64 -d > app/evtv-release.jks
            echo "EVTV_KEY_PASS=$SECRET_PASS" >> "$GITHUB_ENV"
            echo "İmza: GitHub Secrets"
          else
            mkdir -p .evtv-signing
            if [ ! -f .evtv-signing/evtv-release.jks ]; then
              openssl rand -hex 24 > .evtv-signing/pass
              PASS=$(cat .evtv-signing/pass)
              keytool -genkeypair -keystore .evtv-signing/evtv-release.jks -alias evtv \
                -keyalg RSA -keysize 2048 -validity 36500 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Ev TV, C=TR"
              echo "::notice::Yeni imza anahtarı oluşturuldu ve önbelleğe alınacak."
            fi
            PASS=$(cat .evtv-signing/pass)
            echo "::add-mask::$PASS"
            cp .evtv-signing/evtv-release.jks app/evtv-release.jks
            echo "EVTV_KEY_PASS=$PASS" >> "$GITHUB_ENV"
            echo "İmza: Actions önbelleği"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK derle
        run: gradle --no-daemon assembleRelease

      - name: Dosya adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk ev-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ev-tv-apk
          path: ev-tv.apk
          retention-days: 30

      # main'e her push'ta: app/build.gradle'daki versionName ile (ör. v1.0) Release açılır/güncellenir
      - name: Sürüm numarasını oku
        if: github.ref == 'refs/heads/main'
        id: ver
        run: echo "name=v$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Sürüm yayınla
        if: steps.sign.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name || github.ref_name }}
          name: Ev TV ${{ steps.ver.outputs.name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ev-tv.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
