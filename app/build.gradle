plugins {
    id 'com.android.application'
}

android {
    namespace 'com.evim.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.evim.tv'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '2.2'
    }

    // Sabit imza: her sürüm aynı anahtarla imzalanmalı ki eskinin üzerine kurulsun.
    // Anahtar repoda YOK: GitHub Actions ilk derlemede rastgele şifreyle üretir,
    // önbellekte saklar ve app/evtv-release.jks + EVTV_KEY_PASS olarak verir.
    // CI ayrıca parmak izini .github/signing-sha256 ile karşılaştırır.
    def evtvKeystore = file('evtv-release.jks')
    signingConfigs {
        evtv {
            storeFile evtvKeystore
            storePassword System.getenv('EVTV_KEY_PASS')
            keyAlias 'evtv'
            keyPassword System.getenv('EVTV_KEY_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig evtvKeystore.exists() ? signingConfigs.evtv : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/*.version'
            ]
        }
    }
}

dependencies {
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
