plugins {
    id 'com.android.application'
}

android {
    namespace 'com.evim.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.evim.tv'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    // v1.2'de sorunsuz kurulan imza türü: Android debug anahtarı. Anahtar dosyası
    // (~/.android/debug.keystore) GitHub Actions önbelleğinde saklanır, böylece her
    // sürüm aynı anahtarla imzalanır ve eskinin üzerine güncelleme olarak kurulur.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/*.version'
            ]
        }
    }
}

dependencies {
    implementation 'com.anthropic:anthropic-java:3.2.0'
}
